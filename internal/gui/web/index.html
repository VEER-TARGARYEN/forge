<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>FORGE</title>
<meta name="theme-color" content="#0d1513">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FORGE">
<link rel="stylesheet" href="/app.css">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-mark" data-icon="forge"></div>
      <div class="col">
        <span class="brand-name">FORGE</span>
        <span class="t-meta" style="font-size:9px">Workspace</span>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <div class="row" style="gap:8px">
        <span class="dot" id="foot-dot"></span>
        <span class="t-mono dimmer truncate grow" id="foot-model">no model</span>
      </div>
    </div>
  </aside>

  <div id="main">
    <header id="topbar">
      <div class="crumbs" id="crumbs"></div>
      <div class="grow"></div>
      <button class="chip" id="ws-chip" style="max-width:280px;cursor:pointer"></button>
      <button class="btn btn-ghost btn-sm" id="palette-btn">
        <span data-icon="search"></span> Search <span class="kbd">&#8984;K</span>
      </button>
    </header>
    <div id="signal" class="idle"></div>
    <main id="view"></main>
  </div>
</div>

<div id="overlay-root"></div>
<div class="toast-wrap" id="toasts"></div>

<script src="/app.js"></script>
</body>
</html>
